name: iQuant4 Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release environment
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install -e ".[dev,tomography,release]"

      - name: Verify repository hygiene
        run: python tools/verify_repository_hygiene.py --root . --require-git

      - name: Run scientific and release tests
        run: python -m pytest -q

      - name: Run release gates
        run: >-
          python tools/verify_release_gate.py &&
          python tools/verify_public_preview.py &&
          python -m iq4comm doctor

      - name: Build release candidate
        run: python -m build --wheel --sdist --outdir dist/release-candidate

      - name: Check package metadata
        run: python -m twine check dist/release-candidate/*

      - name: Verify release candidate
        run: python tools/verify_release_candidate.py dist/release-candidate

      - name: Upload verified release candidate
        uses: actions/upload-artifact@v7
        with:
          name: iq4comm-release-candidate
          path: dist/release-candidate/*
          if-no-files-found: error
