[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iq4comm"
version = "0.1.0a1"
description = "iQuant4 developer alpha for quantum optics and optical/quantum communications"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Amir Yazdanpour" },
]
keywords = [
    "quantum optics",
    "optical communications",
    "quantum communications",
    "tomography",
    "QKD",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.8",
]

[project.scripts]
iq4comm = "iq4comm.cli:main"
iq4comm-receiver-family = "iq4comm.analysis.receiver_family:main"

[project.optional-dependencies]
tomography = [
    "cvxpy>=1.6",
]
dev = [
    "pytest>=8",
    "cvxpy>=1.6",
    "tomli>=2.0; python_version < '3.11'",
]
release = [
    "build>=1.2",
    "twine>=5.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["iqcore*", "iq4comm*"]
exclude = ["archive*", "docs*", "examples*", "tests*", "tools*"]
