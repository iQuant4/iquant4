[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iq4comm"
version = "0.2.0a1"
description = "iQuant4 — a unified engine for optical and quantum communications, and their coexistence on one fiber"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Amir Yazdanpour" },
]
keywords = [
    "quantum optics",
    "optical communications",
    "quantum communications",
    "QKD",
    "quantum key distribution",
    "coexistence",
    "DWDM",
    "quantum repeater",
    "tomography",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Telecommunications Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: System :: Networking",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/iQuant4/iquant4"
Repository = "https://github.com/iQuant4/iquant4"
Documentation = "https://github.com/iQuant4/iquant4/tree/main/docs"
Issues = "https://github.com/iQuant4/iquant4/issues"
Changelog = "https://github.com/iQuant4/iquant4/blob/main/CHANGELOG.md"

[project.scripts]
iq4comm = "iq4comm.cli:main"
iq4comm-receiver-family = "iq4comm.analysis.receiver_family:main"

[project.optional-dependencies]
tomography = [
    "cvxpy>=1.6",
]
ml = [
    "scikit-learn>=1.3",
]
dev = [
    "pytest>=8",
    "cvxpy>=1.6",
    "scikit-learn>=1.3",
    "tomli>=2.0; python_version < '3.11'",
]
release = [
    "build>=1.2",
    "twine>=5.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["iqcore*", "iq4comm*"]
exclude = ["archive*", "docs*", "examples*", "tests*", "tools*", "validation*"]
